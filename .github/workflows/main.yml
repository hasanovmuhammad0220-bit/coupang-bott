name: Run Coupang Bot

on:
schedule:
- cron: '45 22 * * *'
workflow_dispatch:

jobs:
run-bot:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests beautifulsoup4 python-telegram-bot apify-client

  - name: Run script
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    run: python bot/coupang_bot.py
